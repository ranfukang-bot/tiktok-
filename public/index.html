<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Studio 批量发布控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>TikTok Studio 批量发布控制台</h1>
  <div id="global-controls">
    <span id="status-badge" class="stopped">已停止</span>
    <button id="btn-start" class="primary">启动自动发布</button>
    <button id="btn-stop">停止</button>
  </div>
</header>

<main>
  <div id="global-error" class="error-banner hidden"></div>

  <section class="card" id="accounts-section">
    <div class="section-header">
      <h2>账号列表</h2>
      <button id="btn-add-account" class="primary">+ 添加账号</button>
    </div>
    <div id="accounts-empty" style="display:none;">还没有账号，点击右上角"添加账号"开始。</div>
    <div id="accounts-list"></div>
  </section>

  <section class="card">
    <details id="settings-details">
      <summary>全局设置</summary>
      <form id="settings-form">
        <div class="form-grid">
          <div class="field">
            <label>发布间隔 最短（小时）</label>
            <input type="number" min="0.1" step="0.1" id="s-min-hours" required>
          </div>
          <div class="field">
            <label>发布间隔 最长（小时）</label>
            <input type="number" min="0.1" step="0.1" id="s-max-hours" required>
          </div>
          <div class="field">
            <label>同时最多运行几个账号（并发数）</label>
            <input type="number" min="1" step="1" id="s-concurrency" required>
            <div class="hint">建议先用 1，全部账号排队跑，最稳妥。</div>
          </div>
          <div class="field">
            <label>文件夹检查间隔（秒）</label>
            <input type="number" min="5" step="5" id="s-scan-seconds" required>
          </div>
        </div>

        <fieldset>
          <legend>AdsPower 连接设置</legend>
          <div class="form-grid">
            <div class="field">
              <label>本地API地址</label>
              <input type="text" id="s-ads-baseurl">
            </div>
            <div class="field">
              <label>API Key（团队版才需要，没有就留空）</label>
              <input type="text" id="s-ads-apikey">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Hubstudio 连接设置</legend>
          <div class="form-grid">
            <div class="field">
              <label>本地API地址</label>
              <input type="text" id="s-hub-baseurl">
            </div>
            <div class="field">
              <label>API Key（客户端「开发者」页面里"安全校验"开启时才需要）</label>
              <input type="text" id="s-hub-apikey">
            </div>
          </div>
          <details style="margin-top:8px;">
            <summary class="muted">高级：接口路径/字段名（默认值已按官方文档确认，一般不用改）</summary>
            <div class="form-grid" style="margin-top:10px;">
              <div class="field">
                <label>打开环境接口路径</label>
                <input type="text" id="s-hub-openpath">
              </div>
              <div class="field">
                <label>关闭环境接口路径</label>
                <input type="text" id="s-hub-closepath">
              </div>
              <div class="field">
                <label>请求体里环境ID字段名</label>
                <input type="text" id="s-hub-idfield">
              </div>
              <div class="field">
                <label>返回值里调试端口字段名</label>
                <input type="text" id="s-hub-portfield">
              </div>
            </div>
          </details>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="primary">保存全局设置</button>
        </div>
      </form>
    </details>
  </section>

  <section class="card">
    <h2>运行日志</h2>
    <div id="log-panel"></div>
  </section>
</main>

<div id="account-modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="account-modal-title">添加账号</h3>
    <div id="account-form-error" class="error-banner hidden"></div>
    <form id="account-form">
      <input type="hidden" id="a-original-name">
      <div class="form-grid">
        <div class="field">
          <label>账号名称（随便起，用来区分）</label>
          <input type="text" id="a-name" required>
        </div>
        <div class="field">
          <label>用哪个指纹浏览器</label>
          <select id="a-browser">
            <option value="adspower">AdsPower</option>
            <option value="hubstudio">Hubstudio</option>
          </select>
        </div>
        <div class="field">
          <label id="a-profileid-label">环境ID</label>
          <input type="text" id="a-profileid" required>
        </div>
        <div class="field span2">
          <label>视频文件夹（文件名就是商品ID，比如 123456.mp4）</label>
          <div class="row">
            <input type="text" id="a-folder" required placeholder="例如 D:\发布视频\马来一号">
            <button type="button" id="a-browse-btn">浏览…</button>
          </div>
          <div class="hint">如果"浏览"弹不出选择框，直接把 Windows 文件资源管理器地址栏里的路径复制粘贴进来。</div>
        </div>
        <div class="field span2">
          <label>话题标签（逗号分隔，会依次点击历史标签里的这些 #标签）</label>
          <input type="text" id="a-hashtags" placeholder="fyp,tiktok,tiktokshop">
        </div>
        <div class="field span2">
          <label>TikTok Studio 界面语言</label>
          <select id="a-locale">
            <option value="id">印尼语 Bahasa Indonesia（默认）</option>
            <option value="en">英文 English</option>
            <option value="custom">自定义…</option>
          </select>
          <div class="hint">这个跟"账号显示语言"要对应，不对应会导致找不到按钮而报错暂停（不会误发布）。</div>
        </div>
      </div>

      <fieldset id="a-custom-text" style="display:none;">
        <legend>自定义界面文案</legend>
        <div class="form-grid">
          <div class="field"><label>"下一步"按钮文字</label><input type="text" id="a-t-next"></div>
          <div class="field"><label>"立即发布"单选项文字</label><input type="text" id="a-t-now"></div>
          <div class="field"><label>商品搜索框提示文字</label><input type="text" id="a-t-search"></div>
          <div class="field"><label>"添加商品"按钮文字</label><input type="text" id="a-t-addproduct"></div>
          <div class="field"><label>AI声明开关文字</label><input type="text" id="a-t-ai"></div>
          <div class="field"><label>发布按钮文字（逗号分隔）</label><input type="text" id="a-t-post"></div>
          <div class="field"><label>商品弹窗确认按钮文字（逗号分隔）</label><input type="text" id="a-t-confirm"></div>
          <div class="field"><label>"展开更多"按钮文字（逗号分隔）</label><input type="text" id="a-t-more"></div>
        </div>
      </fieldset>

      <div class="modal-actions">
        <button type="button" id="a-delete-btn" class="danger" style="display:none;">删除这个账号</button>
        <span style="flex:1;"></span>
        <button type="button" id="a-cancel-btn">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
